name: drift-watch

# Weekly review-freshness scan: groundings whose review_by is due/expired,
# source URLs that 404 or redirect, and open_law refs whose upstream text was
# amended since the grounding's effective date. open-law comes in through the
# `openlaw` extra; if its probes still report [skipped], amendment detection
# has silently stopped, so the run is reported and the job fails. On a
# finding it opens or updates ONE
# issue per run so the inbox does not flood (reuses any open 'law-drift'
# issue). When the report is clean it closes any open 'law-drift' issue with
# a "drift resolved" comment.
#
# The law-watch job watches the cited instruments themselves, so a law that
# changes before its review_by date (e.g. the EU AI Omnibus) is still
# caught: `law-map watch` queries EUR-Lex (CELEX amendment records), e-Gov
# (revision history) and legislation.gov.uk (changes feed) and flags every
# grounding whose instrument was amended after its reviewed_on/effective
# date. It keeps ONE open 'law-watch' issue, closed again on a clean run.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  drift:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies (incl. the openlaw extra)
        run: uv sync --all-extras --dev
      - name: Offline due/expired scan
        run: |
          uv run law-map check --days 30 > drift.txt 2>&1 || true
          cat drift.txt
          if grep -Eq "EXPIRED|due by|\[source " drift.txt; then
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi
      - name: Source liveness and open-law amendment probes
        run: |
          uv run law-map check --sources --days 30 >> drift.txt 2>&1 || true
          if grep -Eq "\[source |\[open-law (amended|changed|unreachable)\]|\[skipped\]" drift.txt; then
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi
          # [skipped] means open-law was not importable: amendment detection
          # did not run. Fail the job (after the issue is filed) instead of
          # passing green.
          if grep -q "\[skipped\]" drift.txt; then
            echo "::error::open-law amendment probes were skipped (package not importable)"
            echo "PROBES_SKIPPED=1" >> "$GITHUB_ENV"
          fi
      - name: Checkout kanon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: politeuma/kanon
          path: kanon
          persist-credentials: false
      - name: Kanon section cross-reference
        # related_sections ids drift when kanon renames/removes a section —
        # surface it here rather than only on PRs touching law-map itself.
        run: |
          if ! uv run law-map validate --kanon kanon >> drift.txt 2>&1; then
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi
      - name: Open or update drift issue
        if: env.FOUND == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="law-drift"
          body=$(cat drift.txt)
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "Law-map drift report $(date -u +%Y-%m-%d)" --body "$body"
          else
            gh issue create --title "Law-map drift report $(date -u +%Y-%m-%d)" --label "$label" --body "$body"
          fi
      - name: Close drift issue on clean report
        if: env.FOUND != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="law-drift"
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "drift resolved"
          else
            echo "no open $label issue; nothing to close"
          fi
      - name: Fail when open-law probes were skipped
        if: env.PROBES_SKIPPED == '1'
        run: |
          echo "open-law probes skipped — amendment detection is not running" >&2
          exit 1

  law-watch:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Query amendment feeds for cited instruments
        run: |
          uv run law-map watch > law-watch.txt 2>&1 || true
          cat law-watch.txt
          if grep -Eq "\[law-watch (changed|not-found|unreachable)\]" law-watch.txt; then
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi
          # No summary line means the command itself crashed: report it rather
          # than closing the issue as if every instrument were verified.
          if ! grep -q "^law-watch: " law-watch.txt; then
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi
      - name: Open or update law-watch issue
        if: env.FOUND == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="law-watch"
          body=$(printf '%s\n\n%s\n' \
            "Cited instruments changed after the grounding was last verified. Re-verify each grounding against the amended text, then record \`reviewed_on\`." \
            "$(cat law-watch.txt)")
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "Law-watch report $(date -u +%Y-%m-%d)" --body "$body"
          else
            gh issue create --title "Law-watch report $(date -u +%Y-%m-%d)" --label "$label" --body "$body"
          fi
      - name: Close law-watch issue on clean report
        if: env.FOUND != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="law-watch"
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "all cited instruments verified after their latest amendment"
          else
            echo "no open $label issue; nothing to close"
          fi

  - jurisdiction: US
    source_type: precedent
    source_kind: official-secondary
    status: in_force
    authority: "FTC Act Section 5 — unfair or deceptive acts or practices"
    citation: "FTC v. Wyndham Worldwide Corp., 799 F.3d 236 (3d Cir. 2015); In re LabMD, Inc. (order vacated — see negative_history)"
    review_by: "2027-03-31"
    applicability: >
      Companies whose data-security practices are unfair or deceptive;
      enforcement-established baseline that careless handling (including
      exposure via logs and error reports) is actionable.
    scope: "companies subject to FTC unfairness jurisdiction (banks, common carriers, and most nonprofits are outside it)"
    strength: binding
    negative_history:
      - date: "2018-06-06"
        court: "11th Cir."
        holding: >
          Vacated the FTC's 2016 cease-and-desist order against LabMD as
          unenforceably vague (894 F.3d 1304). The order no longer binds, and
          LabMD cannot be cited as decided authority that the logging practice
          itself was held unlawful; Wyndham remains the binding precedent.
    sources:
      - https://www.ftc.gov/legal-library/browse/cases-proceedings
conflicts: []
requires: []
directives:
  human: >
    Treat every log line and error report as publishable. Mask emails, phone
    numbers, names, and IPs before they reach a logger; never attach raw
    request bodies to exception tracking; scrub before shipping telemetry.
  agent: >
    NEVER pass raw user identifiers (email, phone, real name, IP, government
    ID, credentials) to logging, telemetry, or error-reporting calls. Mask or
    hash before serializing. Do not include request bodies or headers in
    exception reports without scrubbing.

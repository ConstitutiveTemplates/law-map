    citation: "Art. 5(1)(f) integrity and confidentiality; Art. 32 security of processing"
    effective: "2018-05-25"
    review_by: "2027-03-31"
    applicability: "controllers and processors of personal data of data subjects in the Union"
    scope: "controllers and processors offering goods/services to, or monitoring, people in the Union (extraterritorial)"
    exceptions: "purely household activity (Art. 2(2)(c)); competent-authority processing under the Law Enforcement Directive"
    strength: binding
    sources:

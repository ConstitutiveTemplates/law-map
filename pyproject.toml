[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "law-map"
version = "0.1.0"
description = "Machine-readable obligation graph mapping legal groundings (statute, precedent, guidance) to technical obligations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# open-law resolves grounding `open_law` refs for `law-map check --sources`
# amendment probes; without it every probe reports [skipped].
openlaw = ["open-law; python_version >= '3.11'"]

[project.scripts]
law-map = "law_map.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
open-law = { git = "https://github.com/politeuma/open-law" }

[tool.hatch.build.targets.wheel]
packages = ["src/law_map"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/law_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]